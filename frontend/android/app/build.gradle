apply plugin: 'com.android.application'

def signingValue = { String key ->
    providers.gradleProperty(key).orNull ?: System.getenv(key)
}

def releaseSigning = [
    storeFile: signingValue('INVENTAI_RELEASE_STORE_FILE'),
    storePassword: signingValue('INVENTAI_RELEASE_STORE_PASSWORD'),
    keyAlias: signingValue('INVENTAI_RELEASE_KEY_ALIAS'),
    keyPassword: signingValue('INVENTAI_RELEASE_KEY_PASSWORD'),
]
def releaseSigningConfigured = releaseSigning.values().every {
    it != null && !it.toString().trim().isEmpty()
}
def releaseKeystore = releaseSigningConfigured ? rootProject.file(releaseSigning.storeFile) : null
def releaseSigningReady = releaseSigningConfigured && releaseKeystore.isFile()

android {
    namespace = "com.inventai.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.inventai.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 30000
        versionName "3.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile releaseKeystore
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

def validateReleaseSigning = tasks.register('validateReleaseSigning') {
    group = 'verification'
    description = 'Fails unless all InventAI release-signing values and the keystore are available.'
    doLast {
        if (!releaseSigningReady) {
            throw new GradleException(
                'Release signing is not configured. See frontend/ANDROID.md for the required environment variables.'
            )
        }
    }
}

// Guard both direct artifact tasks and aggregate paths such as `assemble`, `bundle`,
// and `build`, which reach these variant tasks through their normal dependencies.
def guardedReleaseArtifactTasks = [
    'assembleRelease',
    'bundleRelease',
    'packageRelease',
    'packageReleaseBundle',
    'packageReleaseUniversalApk',
    'signReleaseBundle',
] as Set

tasks.configureEach { task ->
    if (guardedReleaseArtifactTasks.contains(task.name)) {
        task.dependsOn(validateReleaseSigning)
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
